# schema: https://scanner.dev/schema/scanner-detection-rule.v1.json
name: AWS Kinesis Firehose stream destination modified
description: |-
  ## Goal
  Detects when an AWS Kinesis Firehose Destination is modified.

  ## Strategy
  The rule monitors AWS Kinesis Firehose logs and detects when the event name is "UpdateDestination."

  ## Triage and response
  1. Determine if the user identity is expected to perform the "UpdateDestination" API call on the account.
  2. If the API call was not made by the user, rotate the user credentials and investigate other successfully accessed APIs.
     * Rotate the credentials.
     * Investigate if the same credentials made other unauthorized API calls.
severity: Medium
query_text: |-
  @scnr.source_type:"aws:cloudtrail"
  eventSource:firehose.amazonaws.com
  eventName:UpdateDestination
  (not userAgent:cloudformation.amazonaws.com)
  (not userAgent="APN/*")
  | groupbycount(requestParameters.deliveryStreamName)
  | where @q.count > 0
time_range_s: 300
run_frequency_s: 60
event_sink_keys:
- medium_severity_alerts
tags:
- source.cloudtrail
- techniques.t1562.impair_defenses
- tactics.ta0005.defense_evasion
tests:
  - name: Test no alert for Terraform (APN user agent)
    now_timestamp: "2024-08-21T00:03:00.000Z"
    dataset_inline: |
      {"timestamp":"2024-08-21T00:02:30.000Z","@scnr.source_type":"aws:cloudtrail","eventSource":"firehose.amazonaws.com","eventName":"UpdateDestination","userAgent":"APN/1.0 HashiCorp/1.0 Terraform/1.5.7 (+https://www.terraform.io) terraform-provider-aws/5.31.0","userIdentity":{"arn":"arn:aws:iam::123456789012:user/JohnDoe"},"awsRegion":"us-west-2","requestParameters":{"deliveryStreamName":"my-stream"}}
    expected_detection_result: false
  - name: Test alert for normal user agent
    now_timestamp: "2024-08-21T00:03:00.000Z"
    dataset_inline: |
      {"timestamp":"2024-08-21T00:02:30.000Z","@scnr.source_type":"aws:cloudtrail","eventSource":"firehose.amazonaws.com","eventName":"UpdateDestination","userAgent":"aws-cli/2.15.0 Python/3.11.6 Darwin/23.1.0","userIdentity":{"arn":"arn:aws:iam::123456789012:user/JohnDoe"},"awsRegion":"us-west-2","requestParameters":{"deliveryStreamName":"my-stream"}}
    expected_detection_result: true
