# schema: https://scanner.dev/schema/scanner-detection-rule.v1.json
name: AWS WAF web access control list modified
description: |-
  ## Goal
  Detect updates to an AWS Web Application Firewall (WAF) Access Control List (ACL).

  ## Strategy
  Monitor AWS WAF logs and detect when the event name is "UpdateWebACL".

  ## Triage and response
  1. Verify if the user identity is authorized to perform the "UpdateWebACL" API call on the account.
  2. If the API call was unauthorized, rotate the user's credentials and investigate other successfully accessed APIs.
severity: Low
query_text: |-
  @scnr.source_type:"aws:cloudtrail"
  eventSource:waf*.amazonaws.com
  eventName:UpdateWebACL
  (not userAgent="APN/*")
  (not userAgent:cloudformation.amazonaws.com)
  | groupbycount(userIdentity.arn)
  | where @q.count > 0
time_range_s: 300
run_frequency_s: 60
event_sink_keys:
- low_severity_alerts
tags:
- source.cloudtrail
- techniques.t1562.impair_defenses
- tactics.ta0005.defense_evasion
tests:
  - name: Test no alert for Terraform (APN user agent)
    now_timestamp: "2024-08-21T00:03:00.000Z"
    dataset_inline: |
      {"timestamp":"2024-08-21T00:02:30.000Z","@scnr.source_type":"aws:cloudtrail","eventSource":"wafv2.amazonaws.com","eventName":"UpdateWebACL","userAgent":"APN/1.0 HashiCorp/1.0 Terraform/1.5.7 (+https://www.terraform.io) terraform-provider-aws/5.31.0","userIdentity":{"arn":"arn:aws:iam::123456789012:user/JohnDoe"},"awsRegion":"us-west-2","requestParameters":{"name":"my-web-acl"}}
    expected_detection_result: false
  - name: Test alert for normal user agent
    now_timestamp: "2024-08-21T00:03:00.000Z"
    dataset_inline: |
      {"timestamp":"2024-08-21T00:02:30.000Z","@scnr.source_type":"aws:cloudtrail","eventSource":"wafv2.amazonaws.com","eventName":"UpdateWebACL","userAgent":"aws-cli/2.15.0 Python/3.11.6 Darwin/23.1.0","userIdentity":{"arn":"arn:aws:iam::123456789012:user/JohnDoe"},"awsRegion":"us-west-2","requestParameters":{"name":"my-web-acl"}}
    expected_detection_result: true
